<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Survey Form</title>
  </head>
  <body>
    <h1 id="title">Daraz Online Shopping Survey Form</h1>
    <p id="description">Your co-ordination will help us improve the platform</p>

    <form id="survey-form">

      <fieldset>
        <label for="name" id="name-label">Name 
          <input type="text" placeholder="Enter your name" id="name" required>
        </label>

        <label for="email" id="email-label">Email 
          <input type="email" placeholder="Enter your email" id="email" required>
        </label>

        <label for="age" id="number-label">Age 
          <input type="number" placeholder="Age" min="12" max="120" id="number" required>
        </label>

        <label for="dropdown" class="slot-heading">Which option describes your current role?
          <select id="dropdown">
            <option value="">Select current role</option>
            <option value="1">Customer</option>
            <option value="2">Vendor</option>
            <option value="3">Warehouse Worker</option>
          </select>
        </label>
  
        <label class="slot-heading">Would you recommend Daraz to a friend?</label>
        <label for="Definitely">
          <input type="radio" name="recommend" value="1" id="Definitely"> Definitely
        </label>

        <label for="Maybe">
          <input type="radio" name="recommend" value="2" id="Maybe" > Maybe
        </label>
        
        <label for="Not sure">
          <input type="radio" name="recommend" value="3" id="Not sure"> Not sure
        </label>
      
      <label for="dropdown" class="slot-heading">What is your favourite feature of Daraz?
          <select id="dropdown">
            <option value="">Select an option</option>
            <option value="1">Discount Coupon</option>
            <option value="2">Discount Coins</option>
            <option value="3">Free Delivery</option>
          </select>
      </label>

      <label for="improvement" class="slot-heading">What would you like to see improved? (Check all that apply)</label>
        <input type="checkbox" value="1" id="improvement"> Seller verification process<br>
        <input type="checkbox" value="2" id="improvement"> Return and refund policies<br>
        <input type="checkbox" value="3" id="improvement"> Customer complain services<br>
        <input type="checkbox" value="4" id="improvement"> Delivery services<br>
      
    
      <label for="suggestion" class="slot-heading">Any comments or suggestions?</label>
        <textarea id ="suggestions" placeholder="Enter your suggestions here..."></textarea>
        <input type="submit" id="submit" value="Submit">
    </fieldset>
    
    

    </form>
  </body>
</html>
